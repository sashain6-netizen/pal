<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessory Debug Test</title>
    <script src="/profile/accessories.js"></script>
    <script src="/users/script.js"></script>
    <link rel="stylesheet" href="/users/style.css">
    <style>
        body { padding: 20px; font-family: Arial, sans-serif; }
        .test-container { 
            width: 150px; height: 150px; 
            border: 2px solid #ccc; 
            border-radius: 50%; 
            position: relative; 
            margin: 20px 0;
            background: #f0f0f0;
        }
        #userAccessoryLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }
        .debug-info {
            background: #f5f5f5;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Accessory Debug Test</h1>
    
    <div class="debug-info">
        <h3>Test Data:</h3>
        <p>User: simon</p>
        <p>Accessories: {hats: 'bucket_hat', glasses: 'none', mouths: 'none', face_accessories: 'none', backgrounds: 'none'}</p>
    </div>

    <div class="test-container">
        <div class="accessory-layer" id="userAccessoryLayer"></div>
    </div>

    <div class="debug-info" id="debug-output">
        <h3>Debug Output:</h3>
        <div id="debug-log"></div>
    </div>

    <script>
        // Override console.log to capture output
        const originalLog = console.log;
        const debugLog = document.getElementById('debug-log');
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            const logEntry = document.createElement('div');
            logEntry.textContent = args.join(' ');
            debugLog.appendChild(logEntry);
        };

        // Test the accessory rendering
        setTimeout(() => {
            const testData = {
                hats: 'bucket_hat',
                glasses: 'none',
                mouths: 'none',
                face_accessories: 'none',
                backgrounds: 'none'
            };
            
            console.log('Starting accessory test...');
            console.log('ACCESSORY_LIBRARY available:', !!window.ACCESSORY_LIBRARY);
            
            if (window.ACCESSORY_LIBRARY) {
                console.log('Bucket hat available:', !!window.ACCESSORY_LIBRARY.hats.bucket_hat);
                renderUserAccessories(testData);
                
                setTimeout(() => {
                    const layer = document.getElementById('userAccessoryLayer');
                    const elements = layer.querySelectorAll('.accessory-element');
                    console.log('Accessory elements rendered:', elements.length);
                    elements.forEach((el, i) => {
                        console.log(`Element ${i}:`, el.className, el.innerHTML.length > 0 ? 'has SVG' : 'no SVG');
                    });
                }, 100);
            } else {
                console.log('ACCESSORY_LIBRARY not loaded');
            }
        }, 100);
    </script>
</body>
</html>
