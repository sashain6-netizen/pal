<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discussion • Pal</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/pages/thread/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="styleshee">
    <link rel="icon" href="/favicon.png" type="image/png">
</head>
<body>
    <main class="container" style="margin-top: 120px; padding-bottom: 200px;">
        <div class="thread-header feature-card">
            <a href="/pages" class="back-link">← Back to Board</a>
            <h1 id="thread-title">Loading Thread...</h1>
        </div>

        <div id="posts-container"></div>

        <div id="pagination-container" style="text-align: center; margin: 20px 0;"></div>
    </main>
    <div class="reply-box">
        <div class="reply-inner">
            <textarea id="replyText" placeholder="What's on your mind? Share your thoughts..."></textarea>
            <button class="reply-btn" onclick="postReply()">Post Reply</button>
        </div>
    </div>

    <script src="/global-auth.js"></script>
    <script src="/global-settings.js"></script>
    <script src="/navbar.js"></script>
    <script src="/utils/timestamp.js"></script>
    <script src="/utils/modal.js"></script>
    <script src="/utils/universal-accessories.js"></script>
    <script src="/utils/avatar-svg.js"></script>
    <script src="/pages/thread/script.js"></script>
</body>
</html>
