<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hub • Pal</title>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="stylesheet" href="/style.css"></script>
    <link rel="stylesheet" href="/intel/style.css">
</head>
<body>
    <div class="ai-container">
        <aside class="model-sidebar">
            <h2>AI Models</h2>
            <div class="model-option active" onclick="selectModel('pal-ai', this)">
                <span class="icon">✨</span> Pal AI (Llama 3)
            </div>
            <div class="model-option" onclick="selectModel('gpt-4o', this)">
                <span class="icon">🤖</span> ChatGPT (GPT-4o)
            </div>
            <div class="model-option" onclick="selectModel('gemini-pro', this)">
                <span class="icon">♊</span> Gemini Pro
            </div>
        </aside>

        <main class="chat-area">
            <div id="chatDisplay" class="chat-display">
                <div class="msg-bubble system-msg">Select a model and start chatting!</div>
            </div>
            
            <form class="input-area" onsubmit="sendAiMessage(event)">
                <input type="text" id="aiInput" placeholder="Message Pal AI..." autocomplete="off">
                <button type="submit" id="sendBtn">Send</button>
            </form>
        </main>
    </div>

    <script src="/global-settings.js"></script>
    <script src="/global-auth.js"></script>
    <script src="/navbar.js"></script>
    <script src="/intel/script.js"></script>
</body>
</html>
