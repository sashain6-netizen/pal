<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pal AI • Pal</title>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Montserrat:wght@500&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.png" type="image/png">
    
    <link rel="stylesheet" href="/style.css"> 
    <link rel="stylesheet" href="/intel/style.css">
</head>
<body>

    <main class="chat-scene">
        <div class="chat-container">
            <div style="padding: 15px 25px; border-bottom: 1px solid rgba(37, 99, 235, 0.05); background: #f8faff;">
                <span style="color: #64748b; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">
                    Pal AI
                </span>
            </div>

            <div id="chat-window" class="chat-window">
                <div class="message ai-message">
                    Hello! I'm your Pal Intel assistant. Ask me about our games, community, or founders!
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off">
                <button id="send-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </main>

    <script src="/navbar.js"></script>
    <script src="/global-settings.js"></script>
    <script src="/global-auth.js"></script>
    <script src="/intel/script.js"></script>
</body>
</html>
