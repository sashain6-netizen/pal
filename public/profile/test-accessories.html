<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessory Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .avatar-preview-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 20px 0;
            border: 2px solid #ccc;
            border-radius: 50%;
        }
        .avatar-with-accessories {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #previewImage {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 1;
        }
        .accessory-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }
        .accessory-element {
            position: absolute;
            transform-origin: center;
            transition: all 0.2s ease;
        }
        .accessory-element.hat {
            animation: hatFloat 3s ease-in-out infinite;
        }
        .accessory-element.glasses {
            animation: glassesShine 4s ease-in-out infinite;
        }
        .accessory-element.mouth {
            animation: mouthPulse 2s ease-in-out infinite;
        }
        .accessory-element.face-accessory {
            animation: faceAccessoryWiggle 5s ease-in-out infinite;
        }
        .accessory-element.background {
            animation: backgroundTwinkle 6s linear infinite;
        }
        @keyframes hatFloat {
            0%, 100% { transform: translate(-50%, -50%) translateY(0px); }
            50% { transform: translate(-50%, -50%) translateY(-2px); }
        }
        @keyframes glassesShine {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.9; }
        }
        @keyframes mouthPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
        }
        @keyframes faceAccessoryWiggle {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            25% { transform: translate(-50%, -50%) rotate(1deg); }
            75% { transform: translate(-50%, -50%) rotate(-1deg); }
        }
        @keyframes backgroundTwinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }
        .test-controls {
            margin: 20px 0;
        }
        button {
            margin: 5px;
            padding: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Accessory Test Page</h1>
    
    <div class="avatar-preview-container">
        <div class="avatar-with-accessories" id="avatarWithAccessories">
            <img id="previewImage" src="/default-avatar.png" alt="Profile preview">
            <div class="accessory-layer" id="accessoryLayer"></div>
        </div>
    </div>

    <div class="test-controls">
        <h3>Avatar Controls</h3>
        <button onclick="setColoredAvatar()">Use Colored SVG Avatar</button>
        <button onclick="setDefaultAvatar()">Use Default Avatar</button>
        <label>
            Theme Color:
            <input type="color" id="themeColor" value="#2563eb" onchange="updateThemeColor()">
        </label>
        <label>
            Username:
            <input type="text" id="username" value="TestUser" onchange="updateColoredAvatar()">
        </label>
        
        <h3>Accessory Controls</h3>
        <button onclick="testAccessory('hats', 'cap')">Test Cap</button>
        <button onclick="testAccessory('glasses', 'sunglasses')">Test Sunglasses</button>
        <button onclick="testAccessory('mouths', 'smile')">Test Smile</button>
        <button onclick="testAccessory('face_accessories', 'mustache')">Test Mustache</button>
        <button onclick="testAccessory('backgrounds', 'sparkles')">Test Sparkles</button>
        <button onclick="clearAccessories()">Clear All</button>
    </div>

    <div id="console-output" style="background: #f5f5f5; padding: 10px; margin-top: 20px; font-family: monospace; max-height: 200px; overflow-y: auto;"></div>

    <script src="accessories.js"></script>
    <script src="accessory-manager.js"></script>
    <script>
        // Override console.log to show in page
        const originalLog = console.log;
        const originalWarn = console.warn;
        const consoleOutput = document.getElementById('console-output');
        
        function addToConsole(message, type = 'log') {
            const div = document.createElement('div');
            div.style.color = type === 'warn' ? 'orange' : 'black';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            consoleOutput.appendChild(div);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            addToConsole(args.join(' '), 'log');
        };
        
        console.warn = function(...args) {
            originalWarn.apply(console, args);
            addToConsole(args.join(' '), 'warn');
        };

        function testAccessory(category, accessoryKey) {
            console.log(`Testing accessory: ${category} -> ${accessoryKey}`);
            if (window.accessoryManager) {
                window.accessoryManager.selectAccessory(category, accessoryKey);
            } else {
                console.error('Accessory manager not ready');
            }
        }

        function clearAccessories() {
            console.log('Clearing all accessories');
            if (window.accessoryManager) {
                window.accessoryManager.setAccessoriesData({
                    hats: 'none',
                    glasses: 'none',
                    mouths: 'none',
                    face_accessories: 'none',
                    backgrounds: 'none'
                });
            }
        }

        // Include the colored avatar functions from script.js
        function generateColoredAvatarSVG(username, themeColor) {
            const hash = username.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
            const baseColor = themeColor || "#2563eb";
            const lightColor = adjustColorBrightness(baseColor, 40);
            const darkColor = adjustColorBrightness(baseColor, -20);
            
            const patternType = hash % 4;
            
            let pattern = '';
            switch (patternType) {
                case 0:
                    pattern = `
                        <defs>
                            <pattern id="stripes" patternUnits="userSpaceOnUse" width="20" height="20">
                                <rect width="10" height="20" fill="${lightColor}"/>
                                <rect x="10" width="10" height="20" fill="${darkColor}"/>
                            </pattern>
                        </defs>
                        <rect width="100" height="100" fill="url(#stripes)"/>
                    `;
                    break;
                case 1:
                    pattern = `
                        <defs>
                            <pattern id="dots" patternUnits="userSpaceOnUse" width="25" height="25">
                                <rect width="25" height="25" fill="${lightColor}"/>
                                <circle cx="12.5" cy="12.5" r="4" fill="${darkColor}"/>
                            </pattern>
                        </defs>
                        <rect width="100" height="100" fill="url(#dots)"/>
                    `;
                    break;
                case 2:
                    pattern = `
                        <defs>
                            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:${lightColor};stop-opacity:1" />
                                <stop offset="100%" style="stop-color:${darkColor};stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <rect width="100" height="100" fill="url(#gradient)"/>
                    `;
                    break;
                case 3:
                    pattern = `
                        <rect width="100" height="100" fill="${lightColor}"/>
                        <polygon points="0,0 50,50 0,100" fill="${darkColor}"/>
                        <polygon points="100,0 50,50 100,100" fill="${darkColor}"/>
                    `;
                    break;
            }
            
            const initials = username
                .split(' ')
                .map(word => word.charAt(0).toUpperCase())
                .slice(0, 2)
                .join('');
            
            const svg = `
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    ${pattern}
                    <circle cx="50" cy="50" r="45" fill="${baseColor}" fill-opacity="0.9"/>
                    <text x="50" y="50" 
                          text-anchor="middle" 
                          dominant-baseline="central" 
                          font-family="Arial, sans-serif" 
                          font-size="28" 
                          font-weight="bold" 
                          fill="white">${initials}</text>
                </svg>
            `;
            
            return `data:image/svg+xml;base64,${btoa(svg)}`;
        }

        function adjustColorBrightness(color, percent) {
            color = color.replace('#', '');
            const num = parseInt(color, 16);
            const amt = Math.round(2.55 * percent);
            const R = (num >> 16) + amt;
            const G = (num >> 8 & 0x00FF) + amt;
            const B = (num & 0x0000FF) + amt;
            
            const newR = Math.max(0, Math.min(255, R));
            const newG = Math.max(0, Math.min(255, G));
            const newB = Math.max(0, Math.min(255, B));
            
            return '#' + (0x1000000 + newR * 0x10000 + newG * 0x100 + newB).toString(16).slice(1);
        }

        function setColoredAvatar() {
            const username = document.getElementById('username').value;
            const themeColor = document.getElementById('themeColor').value;
            const coloredAvatar = generateColoredAvatarSVG(username, themeColor);
            document.getElementById('previewImage').src = coloredAvatar;
            console.log(`Set colored avatar for ${username} with color ${themeColor}`);
        }

        function setDefaultAvatar() {
            document.getElementById('previewImage').src = "/default-avatar.png";
            console.log('Set default avatar');
        }

        function updateThemeColor() {
            const previewImage = document.getElementById('previewImage');
            if (previewImage.src && !previewImage.src.includes('default-avatar.png')) {
                setColoredAvatar();
            }
        }

        function updateColoredAvatar() {
            const previewImage = document.getElementById('previewImage');
            if (previewImage.src && !previewImage.src.includes('default-avatar.png')) {
                setColoredAvatar();
            }
        }

        // Wait for accessory manager to be ready
        window.addEventListener('accessoryManagerReady', () => {
            console.log('Accessory manager is ready!');
            console.log('Available accessories:', Object.keys(ACCESSORY_LIBRARY));
        });

        // Test with some default accessories after a short delay
        setTimeout(() => {
            if (window.accessoryManager) {
                console.log('Testing with colored avatar and accessories...');
                // Set colored avatar first
                setColoredAvatar();
                
                // Then add accessories
                window.accessoryManager.setAccessoriesData({
                    hats: 'cap',
                    glasses: 'sunglasses',
                    mouths: 'smile',
                    face_accessories: 'none',
                    backgrounds: 'sparkles'
                });
            }
        }, 1000);
    </script>
</body>
</html>
