<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banned Users • Pal Admin</title>
    <script src="/global-settings.js" defer></script>
    <script src="/utils/modal.js" defer></script>
    <script src="/admin/banned-users.js" defer></script>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/admin/banned-users.css">
    <link rel="icon" href="/favicon.png" type="image/png">
</head>
<body class="admin-page">
    <div id="toast-container" class="toast-container"></div>

    <div class="admin-container">
        <div class="admin-header">
            <div class="admin-logo">
                <h1>🚫 Banned Users</h1>
                <p>Manage and view all banned users</p>
            </div>
            <div class="admin-actions">
                <button onclick="refreshBannedUsers()" class="admin-btn refresh-btn">
                    🔄 Refresh
                </button>
                <a href="/admin" class="admin-btn secondary-btn">← Back to Admin</a>
            </div>
        </div>

        <div class="admin-stats">
            <div class="stat-card">
                <div class="stat-number" id="total-banned">0</div>
                <div class="stat-label">Total Banned</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="temporary-bans">0</div>
                <div class="stat-label">Temporary Bans</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="permanent-bans">0</div>
                <div class="stat-label">Permanent Bans</div>
            </div>
        </div>

        <div class="banned-users-container">
            <div class="section-header">
                <h2>Banned Users List</h2>
                <div class="search-filter">
                    <input type="text" id="search-input" placeholder="Search banned users..." class="search-input">
                    <select id="filter-select" class="filter-select">
                        <option value="all">All Bans</option>
                        <option value="temporary">Temporary</option>
                        <option value="permanent">Permanent</option>
                    </select>
                </div>
            </div>

            <div id="banned-users-list" class="banned-users-list">
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p>Loading banned users...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Unban Modal -->
    <div id="unban-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h3>Unban User</h3>
            <p>Are you sure you want to unban <strong id="unban-username"></strong>?</p>
            
            <div class="modal-buttons">
                <button id="confirm-unban" class="admin-btn danger-btn">✅ Unban User</button>
                <button id="cancel-unban" class="admin-btn secondary-btn">❌ Cancel</button>
            </div>
        </div>
    </div>
</body>
</html>
