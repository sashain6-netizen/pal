<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports Management • Pal</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" href="/favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 20px;
        }
        
        .forum-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .forum-header h1 {
            color: var(--blue-deep);
            margin-bottom: 10px;
            font-size: 2.5rem;
            font-weight: 700;
        }
        
        .forum-header p {
            color: var(--blue-soft);
            font-size: 1.1rem;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: var(--off-white);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            border: 1px solid rgba(37, 99, 235, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(10, 45, 143, 0.05);
        }
        
        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--blue-primary);
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: var(--blue-soft);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .reports-list {
            display: grid;
            gap: 20px;
        }
        
        .report-card {
            background: var(--off-white);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid rgba(37, 99, 235, 0.1);
            border-left: 5px solid #f59e0b;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .report-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(10, 45, 143, 0.05);
        }
        
        .report-card.resolved {
            border-left-color: #10b981;
            opacity: 0.8;
        }
        
        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .report-info {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .report-user {
            font-weight: 600;
            color: var(--blue-primary);
            text-decoration: none;
            transition: color 0.2s ease;
        }
        
        .report-user:hover {
            color: var(--blue-deep);
        }
        
        .report-meta {
            color: var(--blue-soft);
            font-size: 0.9rem;
        }
        
        .report-status {
            padding: 6px 16px;
            border-radius: 25px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .status-pending {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #f59e0b;
        }
        
        .status-resolved {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #10b981;
        }
        
        .report-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .btn-small {
            padding: 8px 16px;
            font-size: 0.9rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-resolve {
            background: var(--blue-primary);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        
        .btn-resolve:hover {
            background: var(--blue-deep);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
        }
        
        .btn-view {
            background: var(--blue-primary);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        
        .btn-view:hover {
            background: var(--blue-deep);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
        }
        
        .report-content {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #e2e8f0;
        }
        
        .report-reason {
            font-weight: 600;
            color: var(--blue-deep);
            margin-bottom: 8px;
            text-transform: capitalize;
        }
        
        .report-description {
            color: var(--blue-soft);
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .report-timestamp {
            font-size: 0.85rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--blue-soft);
            background: var(--off-white);
            border-radius: 24px;
            border: 2px dashed rgba(37, 99, 235, 0.1);
        }
        
        .empty-state h2 {
            color: var(--blue-deep);
            margin: 0 0 10px 0;
            font-size: 1.8rem;
        }
        
        .empty-state p {
            color: var(--blue-soft);
            margin: 0;
            font-size: 1.1rem;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(37, 99, 235, 0.3);
            border-radius: 50%;
            border-top-color: var(--blue-primary);
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 60px 15px;
            }
            
            .forum-header h1 {
                font-size: 2rem;
            }
            
            .report-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .report-actions {
                width: 100%;
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>
    
    <div class="container">
        <div class="forum-header">
            <h1>Reports Management</h1>
            <p>Monitor and manage user reports</p>
        </div>
        
        <div class="stats-grid" id="stats-grid" style="display: none;">
            <div class="stat-card">
                <div class="stat-number" id="total-reports">0</div>
                <div class="stat-label">Total Reports</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pending-reports">0</div>
                <div class="stat-label">Pending</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="resolved-reports">0</div>
                <div class="stat-label">Resolved</div>
            </div>
        </div>
        
        <div class="reports-list" id="reports-list">
            <div class="empty-state">
                <div class="loading-spinner"></div>
                <h2>Loading Reports</h2>
                <p>Please wait while we fetch the latest reports...</p>
            </div>
        </div>
    </div>

    <script src="/global-auth.js"></script>
    <script src="/navbar.js"></script>
    <script>
        let currentUser = null;

        // Format timestamp for consistent display across the platform
        function formatTimestamp(dateString) {
            const postDate = new Date(dateString);
            const now = new Date();
            
            // Compare using local timezone by getting the date parts in local time
            const postDateLocal = new Date(postDate.getFullYear(), postDate.getMonth(), postDate.getDate());
            const nowLocal = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const isToday = postDateLocal.getTime() === nowLocal.getTime();

            if (isToday) {
                return postDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else {
                return postDate.toLocaleDateString('en-US', { year: 'numeric', month: '2-digit', day: '2-digit' });
            }
        }

        async function getCurrentUser() {
            try {
                const res = await fetch('/api/me', { credentials: 'include' });
                if (res.ok) {
                    currentUser = await res.json();
                }
            } catch (e) {
                console.error('Failed to get current user:', e);
            }
        }

        async function loadReports() {
            const container = document.getElementById('reports-list');
            const statsGrid = document.getElementById('stats-grid');
            
            // Get current user first
            await getCurrentUser();
            
            try {
                const res = await fetch('/api/report-user', { credentials: 'include' });
                
                if (res.status === 403) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h2>Access Denied</h2>
                            <p>You don't have permission to view this page. Admin privileges required.</p>
                        </div>
                    `;
                    return;
                }
                
                if (!res.ok) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h2>Error Loading Reports</h2>
                            <p>Failed to load reports. Please try again later.</p>
                        </div>
                    `;
                    return;
                }
                
                const data = await res.json();
                const reports = data.reports || [];
                
                // Update stats
                updateStats(reports);
                
                if (reports.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <h2>No Reports Found</h2>
                            <p>Great job! There are no pending reports to review.</p>
                        </div>
                    `;
                    return;
                }
                
                // Sort reports by timestamp (newest first)
                reports.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                
                const reportsHTML = reports.map(report => {
                    const isOwner = currentUser && currentUser.rank === 'Owner';
                    
                    return `
                    <div class="report-card ${report.status === 'resolved' ? 'resolved' : ''}">
                        <div class="report-header">
                            <div class="report-info">
                                <a href="/users?id=${report.reportedUsername}" class="report-user">@${report.reportedUsername}</a>
                                <span class="report-meta">reported by</span>
                                <a href="/users?id=${report.reporterUsername}" class="report-user">@${report.reporterUsername}</a>
                                <span class="report-status status-${report.status}">${report.status}</span>
                            </div>
                            <div class="report-actions">
                                <button class="btn-small btn-view" onclick="viewUser('${report.reportedUsername}')">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                        <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                    View User
                                </button>
                                ${report.status === 'pending' ? `
                                    <button class="btn-small btn-resolve" onclick="resolveReport('${report.id}')">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <polyline points="20 6 9 17 4 12"/>
                                        </svg>
                                    Resolve
                                </button>
                                ` : ''}
                                ${isOwner ? `
                                    <button class="btn-small btn-delete" onclick="deleteReport('${report.id}')" style="background: linear-gradient(135deg, #ef4444, #dc2626);">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <polyline points="3,6 5,6 21,6"></polyline>
                                            <path d="m19,6v14a2,2 0 0,1 -2,2H7a2,2 0 0,1 -2,-2V6m3,0V4a2,2 0 0,1 2,-2h4a2,2 0 0,1 2,2v2"></path>
                                        </svg>
                                    Delete
                                </button>
                                ` : ''}
                            </div>
                        </div>
                        <div class="report-content">
                            <div class="report-reason">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 8px;">
                                    <circle cx="12" cy="12" r="10"/>
                                    <line x1="12" y1="8" x2="12" y2="12"/>
                                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                                </svg>
                                Reason: ${report.reason.replace('_', ' ')}
                            </div>
                            ${report.description ? `
                                <div class="report-description">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 8px;">
                                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                        <polyline points="14 2 14 8 20 8"/>
                                    </svg>
                                    ${report.description}
                                </div>
                            ` : ''}
                            <div class="report-timestamp">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 5px;">
                                    <circle cx="12" cy="12" r="10"/>
                                    <polyline points="12 6 12 12 16 12"/>
                                </svg>
                                Reported: ${formatTimestamp(report.timestamp)}
                                ${report.resolvedAt ? `
                                    | Resolved: ${formatTimestamp(report.resolvedAt)} by @${report.resolvedBy}
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
                }).join('');
                
                container.innerHTML = reportsHTML;
                
            } catch (error) {
                console.error('Error loading reports:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>Error Loading Reports</h2>
                        <p>Something went wrong while loading reports. Please refresh the page.</p>
                    </div>
                `;
            }
        }
        
        function updateStats(reports) {
            const statsGrid = document.getElementById('stats-grid');
            const total = reports.length;
            const pending = reports.filter(r => r.status === 'pending').length;
            const resolved = reports.filter(r => r.status === 'resolved').length;
            
            document.getElementById('total-reports').textContent = total;
            document.getElementById('pending-reports').textContent = pending;
            document.getElementById('resolved-reports').textContent = resolved;
            
            statsGrid.style.display = 'grid';
        }
        
        async function resolveReport(reportId) {
            if (!confirm('Are you sure you want to mark this report as resolved?')) {
                return;
            }
            
            try {
                const res = await fetch('/api/report-user', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reportId, status: 'resolved' }),
                    credentials: 'include'
                });
                
                if (res.ok) {
                    // Show success message
                    const toast = document.createElement('div');
                    toast.className = 'toast-success';
                    toast.textContent = 'Report marked as resolved';
                    toast.style.cssText = `
                        position: fixed;
                        top: 100px;
                        right: 20px;
                        background: linear-gradient(135deg, #10b981, #059669);
                        color: white;
                        padding: 15px 20px;
                        border-radius: 8px;
                        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
                        z-index: 10000;
                        font-weight: 600;
                        animation: slideIn 0.3s ease;
                    `;
                    document.body.appendChild(toast);
                    
                    setTimeout(() => {
                        toast.style.animation = 'slideOut 0.3s ease';
                        setTimeout(() => document.body.removeChild(toast), 300);
                    }, 3000);
                    
                    // Reload reports
                    loadReports();
                } else {
                    alert('Failed to resolve report');
                }
            } catch (error) {
                console.error('Error resolving report:', error);
                alert('Error resolving report');
            }
        }
        
        async function deleteReport(reportId) {
            if (!confirm('Are you sure you want to delete this report? This action cannot be undone.')) {
                return;
            }
            
            try {
                const res = await fetch('/api/report-user', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reportId, status: 'deleted' }),
                    credentials: 'include'
                });
                
                if (res.ok) {
                    // Show success message
                    const toast = document.createElement('div');
                    toast.className = 'toast-success';
                    toast.textContent = 'Report deleted successfully';
                    toast.style.cssText = `
                        position: fixed;
                        top: 100px;
                        right: 20px;
                        background: linear-gradient(135deg, #ef4444, #dc2626);
                        color: white;
                        padding: 15px 20px;
                        border-radius: 8px;
                        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
                        z-index: 10000;
                        font-weight: 600;
                        animation: slideIn 0.3s ease;
                    `;
                    document.body.appendChild(toast);
                    
                    setTimeout(() => {
                        toast.style.animation = 'slideOut 0.3s ease';
                        setTimeout(() => document.body.removeChild(toast), 300);
                    }, 3000);
                    
                    // Reload reports
                    loadReports();
                } else {
                    const errData = await res.json();
                    alert(errData.error || 'Failed to delete report');
                }
            } catch (error) {
                console.error('Error deleting report:', error);
                alert('Error deleting report');
            }
        }
        
        function viewUser(username) {
            window.location.href = `/users?id=${username}`;
        }
        
        // Add slide animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(100%); opacity: 0; }
            }
        `;
        document.head.appendChild(style);
        
        // Load reports when page loads
        document.addEventListener('DOMContentLoaded', loadReports);
    </script>
</body>
</html>
