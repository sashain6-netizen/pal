<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 • Page Not Found | PAL</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.png" type="image/png">

  <style>
    /* Specific overrides for the 404 layout */
    .error-container {
      text-align: center;
      z-index: 10;
      pointer-events: auto;
    }

    .error-code {
      font-size: 8rem;
      font-weight: 900;
      color: var(--blue-primary);
      line-height: 1;
      margin-bottom: 0;
      background: var(--blue-primary);
      background: var(--blueGrad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 10px rgba(37, 99, 235, 0.2));
    }

    .error-message {
      font-size: 1.5rem;
      color: var(--blue-deep);
      margin-top: 10px;
      margin-bottom: 30px;
    }

    .back-home-btn {
      display: inline-block;
      text-decoration: none;
      background: var(--blue-primary);
      color: white;
      padding: 15px 35px;
      border-radius: 50px;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
    }

    .back-home-btn:hover {
      background: var(--blue-deep);
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }

    /* Keep the smile but make it look a bit "confused" or flat */
    .smile-svg.confused {
      transform: scaleY(-0.5) translateY(-20px);
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div id="navbar-placeholder"></div>

  <div class="scene">
    <div class="error-container">
      <h1 class="error-code">404</h1>
      
      <svg class="smile-svg confused" viewBox="0 0 320 40" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
          </linearGradient>
        </defs>
        <path
          d="M 60 30 C 100 10, 220 10, 260 30"
          fill="none"
          stroke="url(#blueGrad)"
          stroke-width="8"
          stroke-linecap="round"
        />
      </svg>

      <p class="error-message">Oops! Even a PAL gets lost sometimes.</p>
      <a href="/" class="back-home-btn">Take Me Home</a>
    </div>

    <div class="bg-circle bg-circle--1"></div>
    <div class="bg-circle bg-circle--2"></div>
  </div>

  <footer class="main-footer">
    <div class="container">
      <p>&copy; 2026 PAL • Your Everyday School Assistant</p>
    </div>
  </footer>

  <script src="/global-settings.js"></script>
  <script src="/navbar.js"></script>
  <script src="/global-auth.js"></script>
</body>
</html>
