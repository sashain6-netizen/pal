<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 • Page Not Found | PAL</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="/favicon.png" type="image/png">

  <style>
    /* Expand the scene to ensure it fills the view without feeling tight */
    .scene {
      min-height: 100vh;
      height: auto; /* Allow it to grow if needed */
      padding: 120px 20px; /* Big top/bottom padding for "room" */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .error-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      pointer-events: auto;
      max-width: 800px;
      width: 100%;
    }

    .error-code-badge {
      background: rgba(37, 99, 235, 0.1); /* Softer background */
      color: var(--blue-primary);
      padding: 8px 20px;
      border-radius: 50px;
      font-weight: 900;
      font-size: 0.85rem;
      margin-bottom: 40px; /* Increased spacing */
      letter-spacing: 2px;
      border: 1px solid rgba(37, 99, 235, 0.2);
    }

    /* Logo scaling and spacing */
    .logo-container {
        margin-bottom: 20px;
        transform: scale(0.9); /* Slightly larger than before but still balanced */
    }

    .tagline {
      margin-top: 30px !important; /* Force more room above the text */
      font-size: 1.4rem !important;
      color: var(--blue-soft);
      letter-spacing: 0.1em !important;
      text-transform: none !important; /* Keep it friendly */
    }

    .back-home-btn {
      margin-top: 60px; /* Significant gap before the button */
      text-decoration: none;
      background: var(--blue-primary);
      color: white;
      padding: 16px 40px;
      border-radius: 50px;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.2);
    }

    .back-home-btn:hover {
      background: var(--blue-deep);
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(37, 99, 235, 0.3);
    }

    #smilePath {
      transition: stroke-dashoffset 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Responsiveness for small screens so it doesn't feel squashed */
    @media (max-width: 768px) {
      .scene { padding: 100px 20px; }
      .logo-container { transform: scale(0.7); }
      .error-code-badge { margin-bottom: 20px; }
    }
  </style>
</head>
<body>

  <div id="navbar-placeholder"></div>

  <div class="scene">
    <div class="error-wrapper">
      
      <div class="error-code-badge">ERROR 404</div>

      <div class="logo-wrapper">
        <div class="logo-container" id="logoContainer">
          <div class="shine-overlay" id="shineEl"></div>
          
          <svg style="width:0; height:0; position:absolute;">
            <defs>
              <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
                <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(10,45,143,0.15)"/>
              </filter>
              <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
              </linearGradient>
            </defs>
          </svg>

          <svg class="pal-text" id="palText" viewBox="0 0 320 120" xmlns="http://www.w3.org/2000/svg">
            <g transform="skewX(-7)" filter="url(#shadow)">
              <text x="50%" y="85" text-anchor="middle" font-family="'Varela Round', sans-serif" font-weight="900" font-size="100" fill="url(#blueGrad)" letter-spacing="-1">PAL</text>
            </g>
          </svg>

          <svg class="smile-svg" id="smileSvg" viewBox="0 0 320 40" xmlns="http://www.w3.org/2000/svg">
            <path
              id="smilePath"
              d="M 80 25 C 120 20, 200 20, 240 25" 
              fill="none"
              stroke="url(#blueGrad)"
              stroke-width="8"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <p class="tagline" id="tagline">Everyone gets lost sometimes.</p>
      </div>

      <a href="/" class="back-home-btn">Take Me Home</a>
    </div>

    <div class="bg-circle bg-circle--1"></div>
    <div class="bg-circle bg-circle--2"></div>
  </div>

  <footer class="main-footer">
    <div class="container">
      <p>&copy; 2026 PAL • Your Everyday School Assistant</p>
    </div>
  </footer>

  <script src="/global-settings.js"></script>
  <script src="/navbar.js"></script>
  <script src="/global-auth.js"></script>
  <script src="/script.js"></script>
</body>
</html>
