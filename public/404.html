<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 • Page Not Found | PAL</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="/favicon.png" type="image/png">

  <style>
    /* Center the error content within your existing .scene */
    .error-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      pointer-events: auto;
    }

    .error-code-badge {
      background: var(--blue-primary);
      color: white;
      padding: 5px 15px;
      border-radius: 50px;
      font-weight: 900;
      font-size: 0.9rem;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .error-message {
      font-size: 1.4rem;
      color: var(--blue-soft);
      margin: 20px 0 40px 0;
      font-family: 'Varela Round', sans-serif;
    }

    .back-home-btn {
      text-decoration: none;
      background: var(--blue-primary);
      color: white;
      padding: 14px 30px;
      border-radius: 50px;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
    }

    .back-home-btn:hover {
      background: var(--blue-deep);
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }

    /* 404 Twist: The confused smile */
    #smilePath {
      /* This makes the smile flatter/confused compared to the home page */
      transition: stroke-dashoffset 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    .logo-container {
        margin-bottom: 0;
        transform: scale(0.8); /* Slightly smaller logo for the error page */
    }
  </style>
</head>
<body>

  <div id="navbar-placeholder"></div>

  <div class="scene">
    <div class="error-wrapper">
      
      <div class="error-code-badge">ERROR 404</div>

      <div class="logo-wrapper">
        <div class="logo-container" id="logoContainer">
          <div class="shine-overlay" id="shineEl"></div>
          
          <svg style="width:0; height:0; position:absolute;">
            <defs>
              <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
                <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(10,45,143,0.15)"/>
              </filter>
              <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
              </linearGradient>
            </defs>
          </svg>

          <svg class="pal-text" id="palText" viewBox="0 0 320 120" xmlns="http://www.w3.org/2000/svg">
            <g transform="skewX(-7)" filter="url(#shadow)">
              <text x="50%" y="85" text-anchor="middle" font-family="'Varela Round', sans-serif" font-weight="900" font-size="100" fill="url(#blueGrad)" letter-spacing="-1">PAL</text>
            </g>
          </svg>

          <svg class="smile-svg" id="smileSvg" viewBox="0 0 320 40" xmlns="http://www.w3.org/2000/svg">
            <path
              id="smilePath"
              d="M 80 25 C 120 20, 200 20, 240 25" 
              fill="none"
              stroke="url(#blueGrad)"
              stroke-width="8"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <p class="tagline" id="tagline">Even a PAL gets lost sometimes.</p>
      </div>

      <a href="/" class="back-home-btn">Take Me Home</a>
    </div>

    <div class="bg-circle bg-circle--1"></div>
    <div class="bg-circle bg-circle--2"></div>
  </div>

  <footer class="main-footer">
    <div class="container">
      <p>&copy; 2026 PAL • Your Everyday School Assistant</p>
    </div>
  </footer>
  <script src="/script.js"></script>
</body>
</html>
