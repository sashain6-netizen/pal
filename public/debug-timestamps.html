<!DOCTYPE html>
<html>
<head>
    <title>Debug Forum Timestamps</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Debug Forum Timestamps</h1>
    
    <div class="debug-section">
        <h2>Current Time Info</h2>
        <div id="current-time"></div>
    </div>
    
    <div class="debug-section">
        <h2>Forum API Response</h2>
        <button onclick="testForumAPI()">Test Forum API</button>
        <pre id="forum-response"></pre>
    </div>
    
    <div class="debug-section">
        <h2>Chat API Response</h2>
        <button onclick="testChatAPI()">Test Chat API</button>
        <pre id="chat-response"></pre>
    </div>
    
    <div class="debug-section">
        <h2>Thread API Response</h2>
        <button onclick="testThreadAPI()">Test Thread API</button>
        <pre id="thread-response"></pre>
    </div>
    
    <script src="/utils/timestamp.js"></script>
    <script>
        // Show current time info
        const now = new Date();
        document.getElementById('current-time').innerHTML = `
            Local Time: ${now.toLocaleString()}<br>
            UTC Time: ${now.toUTCString()}<br>
            ISO String: ${now.toISOString()}<br>
            Timezone: ${Intl.DateTimeFormat().resolvedOptions().timeZone}<br>
            FormatTimestamp Test: ${formatTimestamp(now.toISOString())}
        `;
        
        async function testForumAPI() {
            try {
                const response = await fetch('/api/forum?limit=5&offset=0', { credentials: 'include' });
                const data = await response.json();
                
                let debugInfo = 'Forum API Response:\n\n';
                debugInfo += JSON.stringify(data, null, 2);
                debugInfo += '\n\n--- Timestamp Analysis ---\n';
                
                if (data.threads && data.threads.length > 0) {
                    data.threads.forEach((thread, index) => {
                        debugInfo += `\nThread ${index + 1}:\n`;
                        debugInfo += `  Raw created_at: ${thread.created_at}\n`;
                        debugInfo += `  Parsed Date: ${new Date(thread.created_at).toString()}\n`;
                        debugInfo += `  Local Format: ${new Date(thread.created_at).toLocaleString()}\n`;
                        debugInfo += `  Our Format: ${formatTimestamp(thread.created_at)}\n`;
                    });
                }
                
                document.getElementById('forum-response').textContent = debugInfo;
            } catch (error) {
                document.getElementById('forum-response').textContent = 'Error: ' + error.message;
            }
        }
        
        async function testChatAPI() {
            try {
                const response = await fetch('/api/my-chats', { credentials: 'include' });
                const data = await response.json();
                
                let debugInfo = 'Chat API Response:\n\n';
                debugInfo += JSON.stringify(data, null, 2);
                
                document.getElementById('chat-response').textContent = debugInfo;
            } catch (error) {
                document.getElementById('chat-response').textContent = 'Error: ' + error.message;
            }
        }
        
        async function testThreadAPI() {
            try {
                // First get a thread list to find a thread ID
                const forumResponse = await fetch('/api/forum?limit=1&offset=0', { credentials: 'include' });
                const forumData = await forumResponse.json();
                
                if (forumData.threads && forumData.threads.length > 0) {
                    const threadId = forumData.threads[0].id;
                    
                    const threadResponse = await fetch(`/api/thread?id=${threadId}&limit=5&offset=0`, { credentials: 'include' });
                    const threadData = await threadResponse.json();
                    
                    let debugInfo = 'Thread API Response:\n\n';
                    debugInfo += JSON.stringify(threadData, null, 2);
                    debugInfo += '\n\n--- Post Timestamp Analysis ---\n';
                    
                    if (threadData.posts && threadData.posts.length > 0) {
                        threadData.posts.forEach((post, index) => {
                            debugInfo += `\nPost ${index + 1}:\n`;
                            debugInfo += `  Raw created_at: ${post.created_at}\n`;
                            debugInfo += `  Parsed Date: ${new Date(post.created_at).toString()}\n`;
                            debugInfo += `  Local Format: ${new Date(post.created_at).toLocaleString()}\n`;
                            debugInfo += `  Our Format: ${formatTimestamp(post.created_at)}\n`;
                        });
                    }
                    
                    document.getElementById('thread-response').textContent = debugInfo;
                } else {
                    document.getElementById('thread-response').textContent = 'No threads found to test';
                }
            } catch (error) {
                document.getElementById('thread-response').textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
