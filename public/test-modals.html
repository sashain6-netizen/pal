<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modal Test • Pal</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.png" type="image/png">
</head>
<body style="padding: 50px; font-family: 'Varela Round', sans-serif;">
    <div class="container">
        <h1>Modal System Test</h1>
        <p>Test the in-game modal system to ensure all alerts and confirms work properly.</p>
        
        <div style="display: flex; flex-direction: column; gap: 20px; max-width: 400px; margin: 30px 0;">
            <button class="nav-btn" onclick="testAlert()">Test Alert</button>
            <button class="nav-btn" onclick="testConfirm()">Test Confirm</button>
            <button class="nav-btn" onclick="testAsyncAlert()">Test Async Alert</button>
            <button class="nav-btn" onclick="testAsyncConfirm()">Test Async Confirm</button>
        </div>
        
        <div id="result" style="margin-top: 30px; padding: 20px; background: #f8fafc; border-radius: 12px; display: none;">
            <h3>Result:</h3>
            <p id="result-text"></p>
        </div>
    </div>

    <script src="/utils/modal.js"></script>
    <script>
        async function testAlert() {
            await window.gameAlert("This is a test alert message!", "Test Alert");
            showResult("Alert test completed successfully!");
        }

        async function testConfirm() {
            const result = await window.gameConfirm("Do you want to proceed with this test?", "Test Confirm");
            showResult(`Confirm result: ${result ? "User clicked OK" : "User clicked Cancel"}`);
        }

        async function testAsyncAlert() {
            showResult("Loading async alert...");
            setTimeout(async () => {
                await window.gameAlert("This alert was triggered after 2 seconds!", "Async Test");
                showResult("Async alert test completed!");
            }, 2000);
        }

        async function testAsyncConfirm() {
            showResult("Loading async confirm...");
            setTimeout(async () => {
                const result = await window.gameConfirm("Do you want to proceed after 2 seconds?", "Async Confirm Test");
                showResult(`Async confirm result: ${result ? "User clicked OK" : "User clicked Cancel"}`);
            }, 2000);
        }

        function showResult(text) {
            const resultDiv = document.getElementById('result');
            const resultText = document.getElementById('result-text');
            resultText.textContent = text;
            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
