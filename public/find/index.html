<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My-Pal | Private Search</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            background-color: #fafafa; 
        }
        .container { text-align: center; width: 90%; max-width: 500px; }
        h1 { color: #333; margin-bottom: 20px; }
        .search-box { display: flex; gap: 10px; }
        input { 
            flex-grow: 1; 
            padding: 15px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            font-size: 16px; 
            outline: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        input:focus { border-color: #de5833; } /* DuckDuckGo Orange-ish focus */
        button { 
            padding: 10px 20px; 
            background: #de5833; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
        }
        button:hover { background: #c44d2d; }
    </style>
</head>
<body>
    <div class="container">
        <h1>My-Pal Search</h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search privately with DuckDuckGo..." autofocus>
            <button onclick="doSearch()">Search</button>
        </div>
    </div>

    <script>
        function doSearch() {
            const query = document.getElementById('searchInput').value;
            if (query.trim() !== "") {
                // Redirects to DuckDuckGo with the encoded query
                window.location.href = `https://duckduckgo.com/?q=${encodeURIComponent(query)}`;
            }
        }

        // Listen for the Enter key
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                doSearch();
            }
        });
    </script>
</body>
</html>
