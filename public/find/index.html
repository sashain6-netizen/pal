<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search • Pal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/favicon.png" type="image/png">
</head>
<body>

<div id="browser-container">
    <header>
        <div id="tab-bar">
            <div id="tabs-list"></div>
            <button id="add-tab-btn">+</button>
        </div>

        <div class="toolbar">
            <button id="back-button" class="nav-btn" title="Back to results" style="display:none;">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor"/>
                </svg>
            </button>
            <input type="text" id="address-input" placeholder="Search or enter URL...">
        </div>
    </header>

    <main id="content-viewport">
        <div id="home-view">
            <h1>Pal</h1>
            <p>Your private gateway.</p>
        </div>
        <div id="results-container"></div>
    </main>

    <footer>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search the web...">
            <button id="search-button">Go</button>
        </div>
    </footer>
</div>
    
    <script src="/navbar.js"></script>
    <script src="/global-settings.js"></script>
    <script src="/global-auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
