<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Browser • Pal</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/find/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.png" type="image/png">
</head>
<body>

    <div class="browser-container">
        <div class="tab-bar" id="tabBar">
            <button class="add-tab" onclick="createNewTab()">+</button>
        </div>

        <div class="address-bar">
            <input type="text" id="urlInput" placeholder="Enter URL (e.g., https://google.com)" onkeydown="if(event.key==='Enter') loadUrl()">
            <button onclick="loadUrl()">Go</button>
        </div>

        <div class="view-container" id="viewContainer">
            </div>
    </div>

    <script src="/global-settings.js"></script>
    <script src="global-auth.js"></script>
    <script src="/navbar.js"></script>
    <script src="script.js"></script>
</body>
</html>
