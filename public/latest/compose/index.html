<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Compose New Post • Pal</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/latest/compose/style.css">
    <link rel="icon" href="/favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="compose-layout-wrapper">
        <aside class="markup-key">
            <h3>Markdown Key</h3>
            <ul>
                <li><strong>**Bold**</strong> <span>**text**</span></li>
                <li><em>*Italic*</em> <span>*text*</span></li>
                <li><ins>Underline</ins> <span>__text__</span></li>
                <li><del>Strikethrough</del> <span>~~text~~</span></li>
                <li><code style="background:#eee;padding:2px">Code</code> <span>`code`</span></li>
                <li><h4 style="margin:0;display:inline">Heading</h4> <span># text</span></li>
                <li><span style="color:#2563eb">Blue</span> <span>[b]text[/b]</span></li>
                <li><span style="color:#ff4757">Red</span> <span>[r]text[/r]</span></li>
                <li>Bullet Point <span>- text</span></li>
            </ul>
        </aside>

        <main class="compose-container">
            <h1>Compose New Post</h1>
            
            <div class="form-group">
                <input type="text" id="title" class="compose-input" placeholder="Article Title" autocomplete="off">
            </div>

            <div class="form-group">
                <select id="category" class="compose-input">
                    <option value="Update">Game Update</option>
                    <option value="Event">Community Event</option>
                    <option value="Community">Community News</option>
                    <option value="General">General</option>
                </select>
            </div>

            <div class="form-group">
                <textarea id="content" class="compose-textarea" placeholder="Write your story here..."></textarea>
            </div>

            <button id="submit-btn">Publish Post</button>
        </main>

        <section class="preview-container">
            <h3>Live Preview</h3>
            <div class="preview-box">
                <article id="article-content">
                    <h1 id="preview-title"></h1>
                    <hr id="preview-hr" style="display:none; margin: 20px 0;">
                    <div id="article-body"></div>
                </article>
            </div>
        </section>
    </div>

    <script src="/global-settings.js"></script>
    <script src="/global-auth.js"></script> 
    <script src="/navbar.js"></script>
    <script src="/utils/modal.js"></script>
    <script src="script.js"></script>
</body>
</html>
