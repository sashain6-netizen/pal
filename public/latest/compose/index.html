<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Post • Pal</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/latest/compose/style.css">
    <link rel="icon" href="/favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="compose-wrapper">
    <div class="container">
        <h1>Compose New Post</h1>
        <div class="form-group">
            <input type="text" id="title" class="compose-input" placeholder="Article Title">
        </div>
        <div class="form-group">
            <select id="category" class="compose-input">
                <option value="General">General News</option>
                <option value="Update">Game Update</option>
                <option value="Event">Community Event</option>
            </select>
        </div>
        <div class="form-group">
            <textarea id="content" class="compose-textarea" placeholder="Content..."></textarea>
        </div>
        <div class="form-group" style="text-align: left; margin-bottom: 20px;">
            <label style="color: var(--blue-soft);">
                <input type="checkbox" id="is_published" checked> Publish immediately
            </label>
        </div>
        <button id="submit-btn">Publish Post</button>
    </div>
</div>

    <script src="/global-settings.js"></script>
    <script src="/global-auth.js"></script> 
    <script src="/navbar.js"></script>
    <script src="script.js"></script>
</body>
</html>
