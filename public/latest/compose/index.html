<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>New Post • Pal</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="stylesheet" href="/latest/compose/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container" style="max-width: 600px; margin: auto;">
        <h1>Compose New Post</h1>
        <input type="text" id="title" placeholder="Article Title" style="width:100%; padding:10px; margin-bottom:10px;">
        <textarea id="content" placeholder="Content (use **bold** and *italics*)" style="width:100%; height:300px; padding:10px;"></textarea>
        <button id="submit-btn" class="btn-new" style="width:100%; border:none; cursor:pointer;">Publish Post</button>
    </div>

    <script src="/global-settings.js"></script>
    <script src="/global-auth.js"></script> 
    <script src="/navbar.js"></script>
    <script src="script.js"></script>
</body>
</html>
