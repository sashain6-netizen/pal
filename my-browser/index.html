<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Browser</title>

<style>
body{
margin:0;
font-family:sans-serif;
}

#tabs{
display:flex;
background:#ddd;
padding:5px;
}

.tab{
padding:6px 12px;
background:#bbb;
margin-right:5px;
cursor:pointer;
}

#controls{
display:flex;
padding:5px;
background:#eee;
}

#url{
flex:1;
padding:5px;
}

webview{
width:100%;
height:90vh;
}
</style>
</head>

<body>

<div id="tabs">
<button onclick="newTab()">+</button>
</div>

<div id="controls">
<button onclick="goBack()">←</button>
<button onclick="goForward()">→</button>
<input id="url" placeholder="Enter URL"/>
<button onclick="go()">Go</button>
</div>

<div id="browser"></div>

<script src="renderer.js"></script>

</body>
</html>
